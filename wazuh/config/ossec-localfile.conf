<!-- Append inside <ossec_config> of /var/ossec/etc/ossec.conf on the manager (scripts/setup_manager.sh does it). -->
<localfile>
  <log_format>json</log_format>
  <location>/var/log/suricata/eve.json</location>
</localfile>
<localfile>
  <!-- EVTX converted by scripts/evtx_to_wazuh.py; replayed through the eventchannel decoder via wazuh-logtest
       or via a Windows agent in a real setup -->
  <log_format>json</log_format>
  <location>/siemlab/samples/*.jsonl</location>
</localfile>
